services:
  app:
    build:
      context: .
      args:
        UPGRADE_EXTRACTORS: ${UPGRADE_EXTRACTORS:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media-files:/app/downloads
    environment:
      MAX_FILE_MB: ${MAX_FILE_MB:-0}
      MAX_PREVIEW_FILE_MB: ${MAX_PREVIEW_FILE_MB:-8192}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-512}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-0}
      MAX_ITEMS: ${MAX_ITEMS:-100}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-10}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-0}
      MAX_JOB_HISTORY: ${MAX_JOB_HISTORY:-100}
      FILE_TTL_SECONDS: ${FILE_TTL_SECONDS:-3600}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      INFO_TIMEOUT_SECONDS: ${INFO_TIMEOUT_SECONDS:-120}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  media-files:
